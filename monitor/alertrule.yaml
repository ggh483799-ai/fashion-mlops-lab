apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: fashion-mlops-slo
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  groups:
  - name: fashion-mlops-slo
    rules:
    - alert: ModelPredictP99LatencyHigh
      expr: |
        histogram_quantile(0.99, sum by (le) (rate(model_predict_latency_seconds_bucket[5m]))) > 0.3
      for: 5m
      labels:
        severity: critical
      annotations:
        summary: "模型服务 P99 延迟超阈值"
        description: "P99 latency > 300ms 持续 5 分钟，SLO 不达标"
    - alert: ModelPredictErrorRateHigh
      expr: |
        sum(rate(model_predict_errors_total[5m])) / clamp_min(sum(rate(model_predict_requests_total[5m])), 1) > 0.05
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "模型服务错误率超阈值"
        description: "预测错误率 > 5% 持续 5 分钟"
    - alert: ModelServiceDown
      expr: up{job="fashion-mlops-serve"} == 0
      for: 2m
      labels:
        severity: critical
      annotations:
        summary: "模型服务不可用"
        description: "模型推理服务抓取失败超过 2 分钟"
