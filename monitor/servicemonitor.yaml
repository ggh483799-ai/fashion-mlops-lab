apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: fashion-mlops-serve
  namespace: default
  labels:
    release: kube-prometheus-stack   # 必须匹配 Prometheus 的 serviceMonitorSelector
spec:
  selector:
    matchLabels:
      app: fashion-mlops-serve
  endpoints:
  - port: http
    path: /metrics
    interval: 15s
