apiVersion: apps/v1
kind: Deployment
metadata:
  name: fashion-mlops-serve
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fashion-mlops-serve
  template:
    metadata:
      labels:
        app: fashion-mlops-serve
    spec:
      containers:
      - name: serve
        image: fashion-mlops-serve:v1
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
          name: http
        resources:
          requests:
            cpu: 100m
            memory: 300Mi
          limits:
            cpu: "2"
            memory: 1Gi
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: fashion-mlops-serve
  namespace: default
  labels:
    app: fashion-mlops-serve
spec:
  selector:
    app: fashion-mlops-serve
  ports:
  - port: 8000
    targetPort: 8000
    name: http
